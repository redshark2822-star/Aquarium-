name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange files
        run: |
          mkdir -p app/src/main/assets app/src/main/java/com/shadowxploit/aquarium
          for f in build*.gradle; do
            if grep -q "apply false" "$f"; then mv "$f" root.tmp; else mv "$f" app/build.gradle; fi
          done
          mv root.tmp build.gradle
          mv AndroidManifest.xml app/src/main/
          mv index.html app/src/main/assets/
          mv MainActivity.java app/src/main/java/com/shadowxploit/aquarium/
          sed -i 's/android:label="Aquarium"/android:label="Terquarium"/' app/src/main/AndroidManifest.xml
          if [ -f icon.png ]; then
            mkdir -p app/src/main/res/mipmap-xxxhdpi
            mv icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            sed -i 's/android:label="Terquarium"/android:label="Terquarium" android:icon="@mipmap\/ic_launcher"/' app/src/main/AndroidManifest.xml
          fi
          sed -i 's/;text-shadow:0 0 6px var(--c)//' app/src/main/assets/index.html
          sed -i 's/font-size:10px;color:var(--c);display:flex;flex-direction:column/font-size:10px;color:#bbb;display:flex;flex-direction:column/' app/src/main/assets/index.html
          sed -i 's/font:bold 9px/font:9px/' app/src/main/assets/index.html
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: mv app/build/outputs/apk/debug/*.apk Terquarium.apk
      - uses: actions/upload-artifact@v4
        with: { name: Terquarium, path: Terquarium.apk }
