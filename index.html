<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>shadowxploit@kali</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#000;color:#fff;font-family:'Courier New',monospace}

/* ── layout: aquarium + optional side terminal ── */
#root{display:flex;height:100%;width:100%;position:relative}
#tank{flex:1;position:relative;overflow:hidden;
  background:linear-gradient(#040d16,#061120 45%,#020810);
  touch-action:none;user-select:none;-webkit-user-select:none;min-width:0}
#glow{position:absolute;inset:0;
  background:radial-gradient(ellipse 80% 40% at 50% -8%,rgba(0,80,180,.22),transparent 70%);
  pointer-events:none}
#rays{position:absolute;inset:-10% -20% 0;
  background:repeating-linear-gradient(105deg,transparent 0 38px,rgba(0,100,200,.04) 38px 72px,transparent 72px 130px);
  -webkit-mask-image:linear-gradient(#000,transparent 80%);mask-image:linear-gradient(#000,transparent 80%);
  animation:sw 14s ease-in-out infinite alternate;pointer-events:none}
@keyframes sw{to{transform:translateX(60px)}}
#sand{position:absolute;left:0;right:0;bottom:0;height:22px;
  background:linear-gradient(transparent,rgba(20,15,5,.8));
  color:#3a2f10;font-size:11px;line-height:26px;white-space:nowrap;overflow:hidden;pointer-events:none}

/* ── entities ── */
.e{position:absolute;white-space:pre;font-size:12px;line-height:12px;pointer-events:none}
.del .e{pointer-events:auto;animation:bl .6s infinite}
.del .e::after{content:'';position:absolute;inset:-10px}
@keyframes bl{50%{opacity:.35}}
.e.pop{animation:pop .3s forwards!important;pointer-events:none}
@keyframes pop{50%{transform:scale(1.8);opacity:.5}to{transform:scale(0);opacity:0}}
.f{position:absolute;font-size:10px;color:#fc4;pointer-events:none;animation:fl var(--d) linear forwards}
@keyframes fl{to{transform:translateY(var(--y));opacity:0}}
.bb{position:absolute;border-radius:50%;border:1px solid rgba(0,120,255,.3);pointer-events:none;animation:fl var(--d) linear forwards}
.rp{position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.25);pointer-events:none;transform:translate(-50%,-50%);animation:rp .5s ease-out forwards}
@keyframes rp{to{width:60px;height:60px;opacity:0}}

/* ── hacked overlay ── */
#hackOverlay{position:absolute;inset:0;background:rgba(0,0,0,.85);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
#hackOverlay.on{display:flex;animation:glitch 2s infinite}
@keyframes glitch{0%,100%{opacity:1}48%{opacity:1}50%{opacity:.7;transform:translate(2px,-1px)}52%{opacity:1;transform:none}}
#hackTxt{color:#0f0;font-size:clamp(10px,2.5vw,16px);text-align:center;line-height:1.6;text-shadow:0 0 10px #0f0}

/* ── badge / toast ── */
#badge{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:2px;padding:4px 12px;border:1px solid;border-radius:20px;background:rgba(0,0,0,.7);opacity:0;transition:opacity .3s;white-space:nowrap;pointer-events:none;z-index:5}
#badge.on{opacity:1}
#toast{position:absolute;top:46px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);border:1px solid #0a1a2a;border-radius:20px;padding:4px 14px;font-size:10px;color:#5a7a9a;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;z-index:20}
#toast.on{opacity:1}

/* ── swipe-left panel ── */
#hint{position:absolute;top:50%;left:4px;transform:translateY(-50%);font-size:9px;letter-spacing:1px;color:rgba(255,255,255,.2);pointer-events:none;writing-mode:vertical-rl;text-orientation:mixed;animation:pu 3s infinite}
@keyframes pu{50%{opacity:.2}}
#panel{position:absolute;top:0;left:0;bottom:0;width:176px;background:#050d14;border-right:1px solid #0a1a28;
  transform:translateX(-105%);transition:transform .35s cubic-bezier(.25,.8,.25,1);z-index:10;
  display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 8px calc(10px + env(safe-area-inset-bottom,0px))}
#panel.open{transform:none}
.hd2{width:3px;height:36px;background:#0a1e30;border-radius:2px;margin:0 auto 12px}
#g{display:grid;grid-template-columns:1fr 1fr;gap:6px;overflow-y:auto}
.b{padding:8px 2px 7px;border:1px solid #0d1e2e;border-radius:8px;background:#060f19;font-size:10px;color:var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.b.on{border-color:var(--c);background:#0a1e30}
.b:active{transform:scale(.95)}
.b pre{font:bold 9px/9px 'Courier New',monospace;margin:0;min-height:27px;display:flex;align-items:center;white-space:pre;text-shadow:0 0 6px var(--c)}

/* ── split-screen terminal ── */
#termSide{width:0;overflow:hidden;background:#000;border-left:1px solid #111;transition:width .35s cubic-bezier(.25,.8,.25,1);display:flex;flex-direction:column;flex-shrink:0}
#termSide.open{width:min(52vw,420px)}
#termSide.full{width:100vw}

/* ── fullscreen terminal overlay (fallback / close) ── */
#term{position:fixed;left:0;right:0;top:0;height:100%;background:#000;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .4s cubic-bezier(.25,.8,.25,1);z-index:100}
#term.open{transform:none}

/* ── shared terminal internals ── */
.tb{display:flex;justify-content:space-between;align-items:center;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 6px;border-bottom:1px solid #111;font-size:11px;color:#444;flex-shrink:0}
.tb .tc{cursor:pointer;color:#333}
.tb .ts{cursor:pointer;color:#333;margin-left:8px}
.to{flex:1;overflow-y:auto;padding:8px 12px;font-size:11px;line-height:1.5;color:#bbb;white-space:pre-wrap;word-break:break-all;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.tir{padding:5px 12px calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid #111;font-size:11px;flex-shrink:0}
.tp2{display:flex;align-items:center}
.tci{flex:1;min-width:0;margin-left:6px;background:transparent;border:0;outline:0;color:#ddd;font:inherit;caret-color:#fff;user-select:text;-webkit-user-select:text}
.pl{color:#4466aa}.pu{color:#2255cc;font-weight:700}.pp{color:#aaa;font-weight:700}
.g{color:#3dff7a}.c{color:#2ab8d8}.y{color:#c8a830}.r{color:#cc4444}.d{color:#444}.w{color:#bbb}.dr{color:#3366cc;font-weight:700}
</style>
</head>
<body>
<div id="root">
  <!-- ── AQUARIUM ── -->
  <div id="tank">
    <div id="glow"></div><div id="rays"></div><div id="sand"></div>
    <div id="hackOverlay"><pre id="hackTxt"></pre></div>
    <div id="badge"></div><div id="toast"></div>
    <div id="hint">◀ swipe</div>
    <div id="panel">
      <div class="hd2"></div>
      <div id="g"></div>
    </div>
  </div>

  <!-- ── SIDE TERMINAL ── -->
  <div id="termSide">
    <div class="tb" id="stb">
      <span id="stt" style="font-size:10px;color:#444">shadowxploit@kali</span>
      <span style="display:flex">
        <span class="ts" id="stkill" title="stop running command">^C</span>
        <span class="ts" id="stfull" title="toggle fullscreen">⛶</span>

      </span>
    </div>
    <div class="to" id="sout"></div>

      <div id="sp1"></div>
      <div class="tp2"><span class="pl">└─</span><span class="pu">$</span><input id="sci" class="tci" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="send"></div>
    </div>
  </div>
</div>

<!-- fullscreen terminal (unused now, kept for compat) -->
<div id="term">
  <div class="tb" id="tb">
    <span id="tt" style="font-size:10px">shadowxploit@kali</span>
    <span class="tc" id="tx">✕ close</span>
  </div>
  <div class="to" id="out"></div>
  <div class="tir">
    <div id="p1"></div>
    <div class="tp2"><span class="pl">└─</span><span class="pu">$</span><input id="ci" class="tci" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="send"></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id),tank=$('tank'),panel=$('panel'),rnd=n=>Math.random()*n|0;
const W=()=>tank.clientWidth,H=()=>tank.clientHeight,FL=()=>H()-14;
$('sand').textContent=".:'.,`:.,'.:".repeat(60);
let ents=[],mode=null,po=false;
const FM={'<':'>','>':'<','(':')',')':'(','/':'\\','\\':'/','[':']',']':'[','{':'}','}':'{','`':"'","'":'`'};
const flip=s=>{const L=s.split('\n'),w=Math.max(...L.map(l=>l.length));return L.map(l=>[...l.padEnd(w)].reverse().map(c=>FM[c]||c).join('')).join('\n')};

class E{
  constructor(k,a,c,x,y){this.k=k;this.a=a;this.L=flip(a);const L=a.split('\n');this.h=L.length*12;this.w=Math.max(...L.map(l=>l.length))*7.2;this.x=x;this.y=y;
    this.el=document.createElement('div');this.el.className='e';this.el.style.color=c;this.el.textContent=a;tank.appendChild(this.el);
    this.el.onclick=ev=>{if(mode==='del'){ev.stopPropagation();this.kill()}};ents.push(this)}
  draw(){this.el.style.left=this.x+'px';this.el.style.top=this.y+'px'}
  face(r){if(r!==this.r){this.r=r;this.el.textContent=r?this.a:this.L}}
  kill(){ents.splice(ents.indexOf(this),1);this.el.classList.add('pop');setTimeout(()=>this.el.remove(),300);toast('Deleted')}
}

const FT=[['><((°>','#4dd8ff',.6],['><(((>','#2effa0',.8],['>><(°>','#ffb347',.4],['><°>','#c3a1ff',1],['><((¤>','#ff5c7a',.7],['><###>','#9bf04a',.45]];
class Fish extends E{
  constructor(x,y){const t=FT[rnd(FT.length)];super('fish',t[0],t[1],x,y);this.s=t[2];this.vx=(.2+Math.random()*.4)*this.s*(Math.random()<.5?1:-1);this.vy=0;this.p=Math.random()*6.28;this.bt=Math.random()*200;this.tx=null}
  up(){this.p+=.022;this.vy+=Math.sin(this.p)*.012;this.vy*=.96;
    if(this.tx!=null){const dx=this.tx-this.x,dy=this.ty-this.y;this.vx+=dx*.004;this.vy+=dy*.01;this.vx=Math.max(-2,Math.min(2,this.vx));
      if(Math.abs(dx)<15&&Math.abs(dy)<15){this.tx=null;this.vx=(this.vx>0?1:-1)*(.2+.3*this.s)}}
    this.x+=this.vx;this.y+=this.vy;const fl=FL()-this.h-8;
    if(this.x<0){this.x=0;this.vx=Math.abs(this.vx)}if(this.x>W()-this.w){this.x=W()-this.w;this.vx=-Math.abs(this.vx)}
    if(this.y<8){this.y=8;this.vy=Math.abs(this.vy)*.5}if(this.y>fl){this.y=fl;this.vy=-Math.abs(this.vy)*.5}
    if(--this.bt<=0){this.bt=100+rnd(200);bub(this.x+20,this.y)}
    this.face(this.vx>0);this.draw()}
}
class Walker extends E{
  constructor(k,a,c,x,y,sp){super(k,a,c,x,y);this.sp=sp;this.vy=0;this.d=Math.random()<.5?1:-1;this.wt=0;this.tx=null}
  up(){const fl=FL()-this.h+2;
    if(this.y<fl-1){this.vy+=.15;this.y+=this.vy;if(this.y>=fl){this.y=fl;this.vy=0}}
    else{this.y=fl;
      if(this.tx!=null){this.d=this.tx>this.x?1:-1;this.x+=this.d*this.sp*2;if(Math.abs(this.tx-this.x)<5)this.tx=null}
      else if(this.wt>0)this.wt--;
      else{this.x+=this.d*this.sp;if(Math.random()<.01)this.wt=40+rnd(80);if(Math.random()<.008)this.d*=-1;if(Math.random()<.004){this.vy=-2.2;this.y-=1}}}
    if(this.x<0){this.x=0;this.d=1}if(this.x>W()-this.w){this.x=W()-this.w;this.d=-1}
    this.face(this.d>0);this.draw()}
}
class Floater extends E{
  constructor(k,fr,c,x,y,sp){super(k,fr[0],c,x,y);this.fr=fr;this.vx=sp*(Math.random()<.5?1:-1);this.p=Math.random()*6.28;this.f=0}
  up(){this.p+=.03;this.y+=Math.sin(this.p)*.5;this.x+=this.vx;
    if(this.x<0){this.x=0;this.vx=Math.abs(this.vx)}if(this.x>W()-this.w){this.x=W()-this.w;this.vx=-Math.abs(this.vx)}
    this.y=Math.max(10,Math.min(FL()-this.h-4,this.y));
    const f=(Date.now()/450|0)%2;if(f!==this.f){this.f=f;this.el.textContent=this.fr[f]}this.draw()}
}
const WC=['#2ecc71','#27ae60','#7bed9f','#1abc9c'];
class Weed extends E{
  constructor(x,n){const A=Array.from({length:n},(_,i)=>i%2?' )':'( ').join('\n'),B=Array.from({length:n},(_,i)=>i%2?'( ':' )').join('\n');super('weed',A,WC[rnd(4)],x,0);this.B=B;this.ph=Math.random()*9;this.f=0}
  up(){const f=((Date.now()/700+this.ph)|0)%2;if(f!==this.f){this.f=f;this.el.textContent=f?this.B:this.a}this.y=FL()-this.h+2;this.draw()}
}
class Shell extends E{
  constructor(x){super('shell',' .--. \n(____)','#f8bbd0',x,0);this.o=' \\  / \n(_oo_)';this.ph=Math.random()*9;this.m=0}
  up(){const m=((Date.now()/1000+this.ph)%7<1.2)|0;if(m!==this.m){this.m=m;this.el.textContent=m?this.o:this.a;if(m&&Math.random()<.5)bub(this.x+16,this.y)}this.y=FL()-this.h+3;this.draw()}
}
class Deco extends E{constructor(a,c,x){super('deco',a,c,x,0)}up(){this.y=FL()-this.h+2;this.draw()}}
const OC=[' .---. \n( o o )\n/|/|/|\\',' .---. \n( o o )\n\\|\\|\\|/'],JF=[' .-^-. \n(_____)\n |/|\\| ',' .-^-. \n(_____)\n \\|/|/ '];

function bub(x,y){const b=document.createElement('div');b.className='bb';const s=3+rnd(7);b.style.cssText=`width:${s}px;height:${s}px;left:${x}px;top:${y}px;--y:${-(y+10)}px;--d:${1.5+Math.random()*2.5}s`;tank.appendChild(b);b.onanimationend=()=>b.remove()}
function rip(x,y){const r=document.createElement('div');r.className='rp';r.style.left=x+'px';r.style.top=y+'px';tank.appendChild(r);r.onanimationend=()=>r.remove()}
function food(x,y){for(let i=0;i<5+rnd(5);i++)setTimeout(()=>{const p=document.createElement('div'),px=Math.max(5,Math.min(W()-10,x+(Math.random()-.5)*50)),fall=(H()-y)*(.4+Math.random()*.5);
  p.className='f';p.textContent=['·','°','•','˙','∘'][rnd(5)];p.style.cssText=`left:${px}px;top:${y}px;--y:${fall}px;--d:${1.2+Math.random()*1.5}s`;tank.appendChild(p);p.onanimationend=()=>p.remove();
  ents.forEach(e=>{if(e.k==='fish'&&Math.random()<.5){e.tx=px;e.ty=y+fall*.5}else if(e instanceof Walker)e.tx=px})},i*70)}

const CAP={fish:15,shrimp:8,weed:15,shell:8,octo:4},NM={fish:'fish',shrimp:'shrimp',weed:'seaweed',shell:'shell',octo:'octopus'};
function add(m,x,y){if(ents.filter(e=>e.k===m).length>=CAP[m]){toast('Limit reached ('+CAP[m]+')');return}
  if(m==='fish')new Fish(x-20,y-6);else if(m==='shrimp')new Walker('shrimp','~=(°>','#ff8a65',x-20,y-6,.35);else if(m==='octo')new Floater('octo',OC,'#c792ea',x-25,y-18,.25);else if(m==='weed')new Weed(x-8,3+rnd(4));else new Shell(x-20);
  toast('Added '+NM[m])}
let tt;function toast(m){const e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),1600)}

/* ── left panel buttons ── */
const BT=[['feed',"  ° ·  °\n · : ˙ ·\n ˙  ∘ ·",'Feed','#c8a830','TAP TO DROP FOOD'],['fish'," ,--.\n><((°>\n '--'",'Fish','#4dd8ff','TAP TO ADD FISH'],['shrimp',"  .-.\n~=(°>\n   ''",'Shrimp','#ff8a65','TAP TO ADD SHRIMP'],['weed'," ) ( \n( ) )\n ) ( ",'Seaweed','#4cd964','TAP TO PLANT SEAWEED'],
['shell'," .--. \n(_@@_)\n '--' ",'Shell','#f8bbd0','TAP TO PLACE A SHELL'],['octo'," .---. \n( o o )\n/|/|/|\\",'Octopus','#c792ea','TAP TO ADD OCTOPUS'],['del',"\\ /\n X \n/ \\",'Delete','#cc3333','TAP AN ITEM TO DELETE'],['term',"┌───┐\n│$_ │\n└───┘",'Terminal','#2a9a4a']];
BT.forEach(b=>{const d=document.createElement('div');d.className='b';d.style.setProperty('--c',b[3]);d.innerHTML='<pre></pre>'+b[2];d.firstChild.textContent=b[1];d.dataset.m=b[0];
  d.onclick=e=>{e.stopPropagation();b[0]==='term'?openTerm():setMode(b[0])};$('g').appendChild(d)});
function setMode(m){const bd=$('badge'),B=BT.find(b=>b[0]===m);document.body.classList.remove('del');
  document.querySelectorAll('.b').forEach(x=>x.classList.remove('on'));
  if(mode===m){mode=null;bd.classList.remove('on')}
  else{mode=m;bd.textContent='[ '+B[4]+' ]';bd.style.color=B[3];bd.classList.add('on');document.querySelector(`.b[data-m=${m}]`).classList.add('on');if(m==='del')document.body.classList.add('del')}
  closeP()}

tank.onclick=e=>{if(panel.contains(e.target)||!mode)return;const r=tank.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  if(mode==='del'){toast('Tap an item to delete it');return}
  rip(x,y);mode==='feed'?food(x,y):add(mode,x,y)};

/* ── swipe left to open panel ── */
let sy=0,sx=0;
tank.addEventListener('touchstart',e=>{if(!panel.contains(e.target)){sy=e.touches[0].clientY;sx=e.touches[0].clientX}},{passive:true});
tank.addEventListener('touchmove',e=>{if(panel.contains(e.target))return;const dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy,pw=panel.offsetWidth;
  if(!po&&dx>20&&Math.abs(dy)<Math.abs(dx)){panel.style.transition='none';panel.style.transform=`translateX(${-pw*(1-Math.min(1,(dx-20)/80))}px)`}
  else if(po&&dx<-20&&Math.abs(dy)<Math.abs(dx)){panel.style.transition='none';panel.style.transform=`translateX(${-pw*Math.min(1,(-dx-20)/80)}px)`}},{passive:true});
tank.addEventListener('touchend',e=>{if(panel.contains(e.target))return;panel.style.transition='';panel.style.transform='';const dx=e.changedTouches[0].clientX-sx;
  if(!po&&dx>50)openP();else if(po&&dx<-50)closeP();else panel.classList.toggle('open',po)},{passive:true});
function openP(){po=true;panel.classList.add('open');$('hint').style.opacity=0}
function closeP(){po=false;panel.classList.remove('open');$('hint').style.opacity=''}
(function loop(){ents.forEach(e=>e.up&&e.up());requestAnimationFrame(loop)})();

/* ── initial entities ── */
for(let i=0;i<5;i++)new Fish(rnd(W()-90),40+rnd(H()-200));
[.1,.35,.6,.85].forEach((p,i)=>new Weed(W()*p,3+rnd(4)));
new Deco('  ___  \n /   \\ \n/_____\\','#1a2530',W()*.22);
new Deco(' \\ | / \n  \\|/  \n   |   ','#cc3366',W()*.7);
new Deco('\\|/\n-*-\n/|\\','#884400',W()*.5);
new Shell(W()*.8);new Walker('crab','V(o_o)V','#aa2222',W()*.4,H()-60,.3);
new Floater('jelly',JF,'#883399',W()*.6,H()*.3,.18);

/* ═══════════════════════════════
   TERMINAL ENGINE (shared)
═══════════════════════════════ */
const U='shadowxploit';
let dir='~',hist=[],hi=-1;
const inst=new Set(['bash','zsh','coreutils','apt','dpkg']);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const P1=()=>`<span class="pl">┌──(</span><span class="pu">${U}㉿kali</span><span class="pl">)-[</span><span class="pp">${dir}</span><span class="pl">]</span>`;
const P2='<span class="pl">└─</span><span class="pu">$</span> ';

/* active output element (side or fullscreen) */
let activeOut=null,activeCI=null,activeP1El=null;
function getOut(){return activeOut||$('sout')}
function getCI(){return activeCI||$('sci')}

function pr(h,c=''){const o=getOut(),s=document.createElement('div');s.className=c;s.innerHTML=h;o.appendChild(s);o.scrollTop=o.scrollHeight}
function err(h){pr(h,'r')}
function syncP(){
  const p1El=activeP1El||$('sp1');if(p1El)p1El.innerHTML=P1();
